<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go WASM Encryption/Decryption with QR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
        }
        #output {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            word-break: break-all;
        }
        #qrCanvas {
            margin-top: 15px;
            display: none;
        }
        #videoContainer {
            margin-top: 15px;
            display: none;
        }
        #video {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <h1>Go WASM Encryption/Decryption Tool with QR</h1>
    
    <div class="input-group">
        <label for="key1">Key Part 1 (Required):</label>
        <input type="text" id="key1" placeholder="Enter first part of key">
    </div>

    <div class="input-group">
        <label for="key2">Key Part 2 (Optional):</label>
        <input type="text" id="key2" placeholder="Enter second part of key (optional)">
    </div>

    <div class="input-group">
        <label for="text">Text to Process:</label>
        <textarea id="text" rows="4" placeholder="Enter text to encrypt or ciphertext to decrypt"></textarea>
    </div>

    <button onclick="encryptText()">Encrypt</button>
    <button onclick="decryptText()">Decrypt</button>
    <button onclick="scanQRCode()">Scan QR with Camera</button>
    <input type="file" id="qrUpload" accept="image/*" onchange="decodeQRFromImage()" style="margin-top: 10px;">

    <div id="output"></div>
    <canvas id="qrCanvas"></canvas>
    <div id="videoContainer">
        <video id="video" autoplay playsinline></video>
        <button onclick="stopScanning()">Stop Scanning</button>
    </div>

    <script src="wasm_exec.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        // Load WASM module
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("crypto.wasm"), go.importObject)
            .then((result) => {
                go.run(result.instance);
                document.getElementById("output").textContent = "WASM module loaded successfully";
            })
            .catch((err) => {
                document.getElementById("output").textContent = `Error loading WASM: ${err}`;
            });

        function encryptText() {
            const key1 = document.getElementById("key1").value;
            const key2 = document.getElementById("key2").value;
            const text = document.getElementById("text").value;
            const output = document.getElementById("output");
            const qrCanvas = document.getElementById("qrCanvas");

            if (!key1 || !text) {
                output.textContent = "Please fill required fields: Key Part 1 and Text";
                return;
            }

            const passphrase = key1 + (key2 || "");
            try {
                const result = goEncrypt(passphrase, text);
                output.textContent = `Encrypted: ${result}`;
                
                // Generate QR code
                qrCanvas.style.display = "block";
                QRCode.toCanvas(qrCanvas, result, { width: 200 }, (error) => {
                    if (error) output.textContent = `QR generation failed: ${error}`;
                });
            } catch (error) {
                output.textContent = `Encryption failed: ${error}`;
            }
        }

        function decryptText() {
            const key1 = document.getElementById("key1").value;
            const key2 = document.getElementById("key2").value;
            const text = document.getElementById("text").value;
            const output = document.getElementById("output");

            if (!key1 || !text) {
                output.textContent = "Please fill required fields: Key Part 1 and Text";
                return;
            }

            const passphrase = key1 + (key2 || "");
            try {
                const result = goDecrypt(passphrase, text);
                output.textContent = result.startsWith("Decryption failed") 
                    ? result 
                    : `Decrypted: ${result}`;
            } catch (error) {
                output.textContent = `Decryption failed: ${error}`;
            }
        }

        // QR Code Scanning with Camera
        let stream = null;
        function scanQRCode() {
            const video = document.getElementById("video");
            const videoContainer = document.getElementById("videoContainer");
            const output = document.getElementById("output");

            videoContainer.style.display = "block";
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then((mediaStream) => {
                    stream = mediaStream;
                    video.srcObject = stream;
                    video.play();
                    scanFrame();
                })
                .catch((err) => {
                    output.textContent = `Camera access failed: ${err}`;
                });
        }

        function scanFrame() {
            const video = document.getElementById("video");
            const textArea = document.getElementById("text");
            const output = document.getElementById("output");
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    textArea.value = code.data;
                    output.textContent = "QR code scanned successfully";
                    stopScanning();
                    return;
                }
            }
            requestAnimationFrame(scanFrame);
        }

        function stopScanning() {
            const videoContainer = document.getElementById("videoContainer");
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            videoContainer.style.display = "none";
        }

        // Decode QR from Uploaded Image
        function decodeQRFromImage() {
            const fileInput = document.getElementById("qrUpload");
            const textArea = document.getElementById("text");
            const output = document.getElementById("output");
            const file = fileInput.files[0];

            if (!file) {
                output.textContent = "Please upload an image";
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    const ctx = canvas.getContext("2d");
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        textArea.value = code.data;
                        output.textContent = "QR code decoded from image successfully";
                    } else {
                        output.textContent = "No QR code found in the uploaded image";
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
